:root{--r:#e10600;--r2:#8f0400;--b:#050505;--c:#111;--t:#f2f2f2;--m:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--b);color:var(--t);font-family:Inter,Arial,sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}

img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.w{max-width:1150px;margin:auto;padding:0 22px}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:rgba(5,5,5,.85);backdrop-filter:blur(10px);border-bottom:1px solid #222}

.logo{font-family:Oswald;font-size:20px;letter-spacing:.15em}.logo b{color:var(--r)}
nav ul{display:flex;gap:26px;list-style:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase}nav li a:hover{color:var(--r)}
.btn{display:inline-block;background:var(--r);color:#fff;padding:14px 30px;font-family:Oswald;letter-spacing:.15em;text-transform:uppercase;font-size:14px;border:1px solid var(--r);transition:.3s;cursor:pointer}

.hero h1{font-size:clamp(44px,9vw,104px);font-weight:700}.hero h1 span{color:var(--r)}
.tag{color:var(--r);letter-spacing:.35em;font-size:12px;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:14px}.tag:before{content:"";width:44px;height:2px;background:var(--r)}
.hero p{max-width:520px;color:#ccc;margin:22px 0 32px;font-size:17px}.hero .btn{margin:0 12px 12px 0}
.fac{position:absolute;right:22px;bottom:18px;font-size:11px;letter-spacing:.2em;color:var(--m);text-transform:uppercase}
section{padding:100px 0}.h{margin-bottom:50px}.h h2{font-size:clamp(32px,5vw,54px)}.h h2 span{color:var(--r)}
.num{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#222;border:1px solid #222;margin-top:40px}
.num div{background:var(--c);padding:28px 10px;text-align:center}.num b{display:block;font-family:Oswald;font-size:40px;color:var(--r)}.num small{color:var(--m);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.sob{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.sob img{border-left:4px solid var(--r);filter:contrast(1.05)}
.sob p{color:#bbb;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.card{background:var(--c);border:1px solid #222;overflow:hidden;transition:.4s;position:relative}
.card:hover{border-color:var(--r);transform:translateY(-6px);box-shadow:0 15px 40px rgba(225,6,0,.15)}
.card .im{height:210px;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;transition:.6s;filter:grayscale(.5)}.card:hover img{transform:scale(1.08);filter:none}
.card div.tx{padding:24px}.card h3{font-size:22px;margin-bottom:8px}.card p{color:var(--m);font-size:14px}.card .n{color:var(--r);font-family:Oswald;font-size:13px;letter-spacing:.2em}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:10px}
.gal div{overflow:hidden;position:relative;border:1px solid #222}.gal div:nth-child(1){grid-column:span 2;grid-row:span 2}.gal div:nth-child(4){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:.6s;filter:grayscale(.6)}.gal div:hover img{filter:none;transform:scale(1.06)}
.gal span{position:absolute;left:0;bottom:0;background:var(--r);padding:4px 14px;font-family:Oswald;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.dep{background:var(--c);border-top:1px solid #222;border-bottom:1px solid #222}
.q{background:var(--b);border:1px solid #222;border-top:3px solid var(--r);padding:30px}.q i{color:var(--r);font-style:normal;letter-spacing:4px}.q p{margin:14px 0 20px;color:#ccc;font-size:15px}
.q b{font-family:Oswald;letter-spacing:.1em;text-transform:uppercase;font-weight:500}.q small{display:block;color:var(--m);font-size:12px}
.cta{text-align:center;background:linear-gradient(135deg,var(--r2),#1a0000 70%)}.cta h2{font-size:clamp(34px,6vw,64px);margin-bottom:20px}.cta p{color:#ddd;margin-bottom:30px}
.cta .btn{background:#fff;color:#000;border-color:#fff}.cta .btn:hover{background:transparent;color:#fff}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.eq img{border:1px solid #222;width:100%}.eq p{color:#bbb;margin-bottom:16px}.chk{list-style:none;margin:20px 0 28px}.chk li{padding:8px 0 8px 30px;position:relative;border-bottom:1px solid #1e1e1e}.chk li:before{content:"▸";color:var(--r);position:absolute;left:4px}
.pl{background:var(--c);border:1px solid #222;padding:34px 26px;text-align:center;transition:.4s;position:relative}.pl:hover{border-color:var(--r);transform:translateY(-6px)}.pl small{color:var(--m);letter-spacing:.25em;text-transform:uppercase;font-size:11px}.pl b{display:block;font-family:Oswald;font-size:46px;color:#fff;margin:10px 0}.pl b sup{font-size:18px;color:var(--r)}.pl p{color:var(--m);font-size:13px;margin-bottom:20px}.pl.f{border-color:var(--r);background:linear-gradient(160deg,#2a0000,#111)}.pl.f:before{content:"MAIS COMPLETO";position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--r);font:12px Oswald;letter-spacing:.2em;padding:3px 14px}.nt{color:var(--m);font-size:13px;text-align:center;margin-top:26px}
.hr{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin:0 0 30px;font-size:14px;color:#eee}.hr span b{color:#000}
footer img{height:60px;margin:0 auto 14px}
@media(max-width:800px){.eq{grid-template-columns:1fr}}
footer{padding:36px 0;text-align:center;color:var(--m);font-size:12px;letter-spacing:.15em;text-transform:uppercase;border-top:1px solid #222}
#cb{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99}
#cbt{width:60px;height:60px;border-radius:50%;background:var(--r);border:0;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 0 0 0 rgba(225,6,0,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 16px rgba(225,6,0,0)}}
#cbw{display:none;position:absolute;right:0;bottom:74px;width:340px;max-width:calc(100vw - 36px);height:460px;max-height:70vh;background:#0c0c0c;border:1px solid var(--r);flex-direction:column;box-shadow:0 20px 60px #000}
#cbw.on{display:flex}#cbw header{background:var(--r);padding:14px 18px;font-family:Oswald;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
#cbw header small{display:block;font:300 11px Inter;letter-spacing:0;text-transform:none;opacity:.85}#cbx{cursor:pointer;background:none;border:0;color:#fff;font-size:20px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;font-size:13.5px;line-height:1.5}.m.b{background:#1c1c1c;border-left:2px solid var(--r);align-self:flex-start}.m.u{background:var(--r);align-self:flex-end}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}.opts button{background:none;border:1px solid #444;color:#eee;padding:6px 12px;font-size:12px;cursor:pointer;border-radius:20px}.opts button:hover{border-color:var(--r);color:var(--r)}
#cf{display:flex;border-top:1px solid #222}#ci{flex:1;background:#111;border:0;color:#fff;padding:14px;font-size:14px;outline:0}#cf button{background:var(--r);border:0;color:#fff;padding:0 18px;cursor:pointer}
@media(max-width:800px){nav ul{display:none}.sob{grid-template-columns:1fr;gap:30px}.num{grid-template-columns:repeat(2,1fr)}.gal{grid-template-columns:1fr 1fr;grid-auto-rows:170px}.gal div:nth-child(1){grid-column:span 2}section{padding:70px 0}}
